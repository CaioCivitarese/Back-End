<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Modelo calcudador de fachetaria</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

  <section class="container">
    <h1>Calcula sua fachetaria</h1>
    <h4>Esse modelo vai calcular com base na sua idade a sua fachetaria atual de vida.</h4>
    <p>
      Primeira Infância;
      <br>
      Segunda Infância;
      <br>
      Terceira Infância;
      <br>
      Adolescência;
      <br>
      Adulto Jovem;
      <br>
      Adulto de Meia-idade;
      <br>
      Idoso.
    </p>
    <form action="" class="form">
      <label for="idade">IDADE</label>
      <input type="text" type="idade" name="idade">

      <button type="submit">ENVIAR</button>

      <div class="resultado"></div>
    </form>
  </section>
  <script src="./assets/js/main.js"></script>
</body>

</html>
